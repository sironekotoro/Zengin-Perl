name: CI/CD

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['master', 'dev']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        perl: ['5.42', '5.40', '5.38', '5.36']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Dependencies
        run: cpm install

      - name: Clone Source Data Repository
        uses: actions/checkout@v6
        with:
          ref: master
          repository: zengin-code/source-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false
          path: share

      - name: Set UPDATED_AT
        run: echo "UPDATED_AT=$(cat share/data/updated_at)" >> $GITHUB_ENV

      - name: Update version
        run: perl -wpi -E'/^our/ and /(\d{8})/ and s/$1/$ENV{UPDATED_AT}/e' lib/Zengin/Perl.pm

      - name: Run Tests
        run: prove -lv t

      - name: Checkout master branch
        if: matrix.perl == '5.38' && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch origin master
          git checkout master
          git pull origin master

      - name: Commit and Push Changes
        if: matrix.perl == '5.38' && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config core.filemode false
          git add -A -- share/data lib/Zengin/Perl.pm
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email action@github.com
            git commit -m "Commit updated files"
            git push origin master
          else
            echo "No changes to commit"
          fi

  pr_checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
      - name: Install Dependencies
        run: cpm install
      - name: Clone Source Data Repository
        uses: actions/checkout@v6
        with:
          ref: master
          repository: zengin-code/source-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false
          path: share
      - name: Run Tests
        run: prove -lv t

  complexity:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Measure Perl complexity
        uses: moznion/cccc-action@v1
        with:
          version: v1.6.0
          path: lib/
          args: --lang perl
          top-cognitive: '10'
