name: CI/CD

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['master', 'dev']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_source_data:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout Repository
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - name: Compare upstream data tree
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual or dev run: run the full test matrix." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream_tree="$(gh api repos/zengin-code/source-data/git/trees/master --jq '.tree[] | select(.path == "data" and .type == "tree") | .sha')"
          test -n "$upstream_tree"
          local_tree="$(git rev-parse HEAD:share/data)"
          if [ "$upstream_tree" = "$local_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream data matches share/data; no sync needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream data changed; run the test matrix before syncing." >> "$GITHUB_STEP_SUMMARY"
          fi

  build_and_deploy:
    needs: check_source_data
    if: github.event_name != 'pull_request' && needs.check_source_data.outputs.changed == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04']
        perl: ['5.42', '5.40', '5.38', '5.36']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Dependencies
        run: cpm install

      - name: Clone Source Data Repository
        uses: actions/checkout@v7
        with:
          ref: master
          repository: zengin-code/source-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false
          path: share

      - name: Set UPDATED_AT
        run: echo "UPDATED_AT=$(cat share/data/updated_at)" >> $GITHUB_ENV

      - name: Update version
        run: perl -wpi -E'/^our/ and /(\d{8})/ and s/$1/$ENV{UPDATED_AT}/e' lib/Zengin/Perl.pm

      - name: Run Tests
        run: prove -lv t

      - name: Checkout master branch
        if: matrix.perl == '5.38' && matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch origin master
          git checkout master
          git pull origin master

      - name: Commit and Push Changes
        if: matrix.perl == '5.38' && matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config core.filemode false
          git add -A -- share/data lib/Zengin/Perl.pm
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email action@github.com
            git commit -m "Commit updated files"
            git push origin master
          else
            echo "No changes to commit"
          fi

  pr_checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
      - name: Install Dependencies
        run: cpm install
      - name: Clone Source Data Repository
        uses: actions/checkout@v7
        with:
          ref: master
          repository: zengin-code/source-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false
          path: share
      - name: Run Tests
        run: prove -lv t

  complexity:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Measure Perl complexity
        uses: moznion/cccc-action@v1
        with:
          version: v1.6.0
          path: lib/
          args: --lang perl --max-cognitive 10 --max-cyclomatic 10
          top-cognitive: '10'
